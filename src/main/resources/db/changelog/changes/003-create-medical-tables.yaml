databaseChangeLog:
  - changeSet:
      id: 4
      author: neqro
      changes:
        - createTable:
            tableName: doctors
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: specialty
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
        - createTable:
            tableName: visits
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: start_time
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: timestamp
              - column:
                  name: version
                  type: bigint
        - createTable:
            tableName: clinics
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: city
                  type: varchar(50)
              - column:
                  name: zip_code
                  type: varchar(10)
              - column:
                  name: street
                  type: varchar(50)
              - column:
                  name: street_number
                  type: int
              - column:
                  name: version
                  type: bigint