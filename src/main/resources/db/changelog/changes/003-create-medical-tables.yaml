databaseChangeLog:
  - changeSet:
      id: 003-create-medical-tables
      author: neqro
      changes:
        - createTable:
            tableName: doctors
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: specialty
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
              - column:
                  name: user_id
                  type: bigint
        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: doctors
            constraintName: fk_doctor_user
            referencedColumnNames: id
            referencedTableName: users
        - createTable:
            tableName: visits
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: start_time
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: timestamp
              - column:
                  name: version
                  type: bigint
              - column:
                  name: doctor_id
                  type: bigint
              - column:
                  name: patient_id
                  type: bigint
        - addForeignKeyConstraint:
            baseTableName: visits
            baseColumnNames: doctor_id
            constraintName: fk_visit_doctor
            referencedTableName: doctors
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: visits
            baseColumnNames: patient_id
            constraintName: fk_visit_patient
            referencedTableName: patients
            referencedColumnNames: id
        - createTable:
            tableName: clinics
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: city
                  type: varchar(50)
              - column:
                  name: zip_code
                  type: varchar(10)
              - column:
                  name: street
                  type: varchar(50)
              - column:
                  name: street_number
                  type: int
              - column:
                  name: version
                  type: bigint