databaseChangeLog:
  - changeSet:
      id: 002-create-users-table
      author: neqro
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
        - addColumn:
            tableName: patients
            columns:
              - column:
                  name: user_id
                  type: bigint
        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: patients
            constraintName: fk_patient_user
            referencedColumnNames: id
            referencedTableName: users