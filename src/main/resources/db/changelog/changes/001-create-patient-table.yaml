databaseChangeLog:
  - changeSet:
      id: 001-create-patients-table
      author: neqro
      changes:
        - createTable:
            tableName: patients
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: id_card_no
                  type: varchar(100)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: birth_day
                  type: date
              - column:
                  name: phone_number
                  type: varchar(15)
              - column:
                  name: version
                  type: bigint
